<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1004" viewBox="0 0 1920 1004" role="img" aria-labelledby="title desc">
  <title id="title">TRUEDAN 기본 전체 파사드</title>
  <desc id="desc">서울역 2층 TRUEDAN 사진 기반 3D 구조물의 정면 기준 이미지</desc>
  <defs>
    <linearGradient id="fascia" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b8b7ae"/>
      <stop offset="1" stop-color="#8f918c"/>
    </linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#505a5c"/>
      <stop offset="1" stop-color="#3f494b"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#18383d"/>
      <stop offset="0.5" stop-color="#10272b"/>
      <stop offset="1" stop-color="#24464a"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8b6141"/>
      <stop offset="1" stop-color="#66442f"/>
    </linearGradient>
  </defs>

  <rect width="1920" height="996" fill="#222a2c"/>
  <rect x="18" y="18" width="1884" height="968" fill="url(#wall)" stroke="#151b1d" stroke-width="36"/>
  <rect x="36" y="36" width="1848" height="220" fill="url(#fascia)"/>
  <rect x="36" y="245" width="1848" height="18" fill="#9aa3a0"/>
  <rect x="72" y="279" width="1776" height="663" fill="#454e50"/>

  <g aria-label="TRUEDAN wordmark">
    <text x="650" y="170" text-anchor="middle" dominant-baseline="middle"
      font-family="Arial, Helvetica, sans-serif" font-size="146" font-weight="700"
      letter-spacing="9" fill="#f6f5ef" stroke="#24272a" stroke-width="10" paint-order="stroke">
      TRUEDAN
    </text>
  </g>

  <g id="service-window">
    <rect x="88" y="307" width="1050" height="584" rx="3" fill="#222a2c"/>
    <rect x="111" y="333" width="1004" height="353" fill="url(#glass)"/>
    <path d="M330 333v353M563 333v353M796 333v353" stroke="#273033" stroke-width="15"/>
    <rect x="111" y="702" width="1004" height="165" fill="url(#wood)"/>
    <path d="M111 735h1004M111 771h1004M111 807h1004M111 843h1004" stroke="#503523" stroke-width="4" opacity="0.82"/>
    <rect x="72" y="874" width="1082" height="36" fill="#9aa3a0" stroke="#222a2c" stroke-width="8"/>
    <g id="menu-panels">
      <rect x="430" y="374" width="230" height="118" rx="2" fill="#222a2c"/>
      <rect x="444" y="388" width="202" height="90" fill="#cfcec1"/>
      <rect x="703" y="374" width="230" height="118" rx="2" fill="#222a2c"/>
      <rect x="717" y="388" width="202" height="90" fill="#cfcec1"/>
    </g>
  </g>

  <g id="side-window">
    <rect x="1180" y="352" width="276" height="405" fill="#222a2c"/>
    <rect x="1201" y="373" width="234" height="363" fill="url(#glass)"/>
  </g>

  <g id="utility-door">
    <rect x="1510" y="302" width="326" height="637" fill="#222a2c"/>
    <rect x="1534" y="326" width="278" height="589" fill="#4b5557"/>
    <rect x="1584" y="381" width="178" height="448" fill="#222a2c"/>
    <g stroke="#525d5f" stroke-width="10">
      <path d="M1592 402h162M1592 431h162M1592 460h162M1592 489h162M1592 518h162M1592 547h162M1592 576h162M1592 605h162M1592 634h162M1592 663h162M1592 692h162M1592 721h162M1592 750h162M1592 779h162"/>
    </g>
    <rect x="1771" y="592" width="18" height="58" rx="8" fill="#a5aeab"/>
  </g>

  <rect x="36" y="942" width="1848" height="44" fill="#222a2c"/>
</svg>
