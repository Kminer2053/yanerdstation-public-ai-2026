<!doctype html><html lang="ko"><meta charset="utf-8"><title>모바일 카메라 비교 검증 · 모의 영상</title>
<script type="module">
// Local-only test fixture. No physical camera permission, recording or upload.
const html=await fetch('/seoul/').then(r=>r.text());
const landscape=new URLSearchParams(location.search).get('camera')==='landscape';
const mock=`<script>
Object.defineProperty(navigator,'mediaDevices',{configurable:true,value:{getUserMedia:async()=>{
 const c=document.createElement('canvas');c.width=${landscape?1280:720};c.height=${landscape?720:1280};
 const x=c.getContext('2d');x.fillStyle='#395a61';x.fillRect(0,0,c.width,c.height);
 x.strokeStyle='#70d1bb';x.lineWidth=3;for(let i=1;i<8;i++){x.beginPath();x.moveTo(c.width*i/8,0);x.lineTo(c.width*i/8,c.height);x.stroke();}
 x.fillStyle='#e4eee5';x.font='32px sans-serif';x.textAlign='center';x.fillText('모의 카메라',c.width/2,c.height/2);
 x.font='24px sans-serif';x.fillText('${landscape?'가로 원본':'세로 원본'} · 촬영 없음',c.width/2,c.height/2+45);
 const stream=c.captureStream(1);const timer=setInterval(()=>{if(stream.getTracks().every(t=>t.readyState==='ended')){clearInterval(timer);return;}x.fillRect(0,0,1,1);},250);return stream;
}}});
<\/script>`;
document.open();document.write(html.replace('<head>','<head>'+mock));document.close();
</script></html>
